name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Claude CLI install directory exists
        run: mkdir -p "$HOME/.local/bin"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Plain prompt instead of the /code-review:code-review plugin slash
          # command: that plugin's orchestrator spawns background subagents
          # and, in this one-shot CI execution, wrongly assumes it'll be
          # notified when they finish — it ends its turn before collecting
          # their results, so nothing ever gets posted. A direct prompt runs
          # as a single agent and avoids that failure mode.
          prompt: |
            Review this pull request (${{ github.repository }}/pull/${{ github.event.pull_request.number }}) for correctness bugs, and for
            violations of this repo's CLAUDE.md conventions (e.g. Models must
            be pure data with no business logic; ViewModels must not import
            SwiftUI; deleteRule must be explicit on every @Relationship).
            Post inline comments via the available comment tool for anything
            you find. If there is nothing worth flagging, do not post any
            comments.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
