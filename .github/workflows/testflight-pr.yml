name: TestFlight from PR

# Builds a PR to the Self TestFlight group. Put the marker below in the PR
# description or in a comment and this tags the PR's head commit; the Xcode Cloud
# workflow "TestFlight PR" starts on that tag, archives and distributes.
#
# No checkout on purpose: issue_comment runs with a write token from the default
# branch, so it must never touch PR code. Everything is read through the API.
#
# issue_comment only fires from the version of this file on master, so the
# comment trigger works once this has been promoted all the way up. The PR
# description trigger works from the first merge into dev.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: testflight-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      pull-requests: read
      issues: read # PR comments are issue comments
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Tag head commit if the marker is present
        run: |
          set -euo pipefail

          MARKER='[testflight]'
          # Only people with write access can ask for a build; the repo is public.
          TRUSTED='select(.author_association | IN("OWNER","MEMBER","COLLABORATOR"))'

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"

          if [[ "$(jq -r .state <<<"$pr")" != "open" ]]; then
            echo "PR #$PR_NUMBER is not open; nothing to do"; exit 0
          fi
          if [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" != "$REPO" ]]; then
            echo "PR #$PR_NUMBER comes from a fork; not building it"; exit 0
          fi

          found=""
          if jq -r "$TRUSTED | (.body // \"\")" <<<"$pr" | grep -qiF -- "$MARKER"; then
            found="description"
          elif gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
                 --jq ".[] | $TRUSTED | (.body // \"\")" | grep -qiF -- "$MARKER"; then
            found="comment"
          fi

          if [[ -z "$found" ]]; then
            echo "No $MARKER marker on PR #$PR_NUMBER; exiting"; exit 0
          fi

          sha="$(jq -r .head.sha <<<"$pr")"
          # Branch names can hold anything git allows, so reduce to a-z, 0-9 and
          # hyphens before it goes near a ref name. ci_pre_xcodebuild.sh reads
          # this tag format back, so keep the two in step.
          slug="$(jq -r .head.ref <<<"$pr" | tr -c 'A-Za-z0-9\n' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//' | cut -c1-60)"
          tag="testflight-pr${PR_NUMBER}-${sha:0:7}-${slug}"

          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; this commit was already sent"; exit 0
          fi

          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          echo "Tagged $sha as $tag (marker found in $found)"
          echo "Tagged \`${sha:0:7}\` as \`$tag\` (marker found in $found). Xcode Cloud takes it from here." >> "$GITHUB_STEP_SUMMARY"
