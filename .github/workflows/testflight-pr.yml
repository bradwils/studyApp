name: TestFlight PR build

# Put /testflight on its own line in a PR's description, or in a comment on the PR,
# to start an Xcode Cloud build of its branch. Xcode Cloud ships it to TestFlight.

on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: testflight-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger:
    # Fork PRs never get secrets. Comments count only from people who can write to the repo.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action != 'edited' || github.event.changes.body != null))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Xcode Cloud build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TEXT: ${{ github.event.pull_request.body || github.event.comment.body }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: personal.studyBud
          WORKFLOW_NAME: ${{ vars.XCODE_CLOUD_PR_WORKFLOW || 'PR TestFlight' }}
        run: |
          if ! printf '%s' "$TEXT" | tr -d '\r' | grep -qiE '^[[:space:]]*/testflight[[:space:]]*$'; then
            echo "No /testflight line; nothing to do."
            exit 0
          fi

          BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          export BRANCH

          pip install --quiet pyjwt cryptography
          python3 .github/scripts/start_xcode_cloud_build.py
