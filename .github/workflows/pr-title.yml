name: PR title

# Merge commits take the PR title, so the title is what lands in history.
on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be 'type(scope): description' (types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert), got '$TITLE'"
            exit 1
          fi
          echo "ok: $TITLE"
