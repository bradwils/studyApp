name: Claude Code

# What starts a run (all need "@claude" unless noted, and a trusted author):
#   issue_comment / pull_request_review_comment  created, edited  - comment on an issue, PR or diff line
#   pull_request_review                          submitted, edited - review body
#   pull_request                                 opened, edited    - PR title or body
#   issues                                       opened            - issue title or body
#   issues                                       labeled "claude"  - no mention needed
#
# Deliberately not triggers:
#   issues edited / assigned  - the action ignores them (it only reads issue text on "opened")
#   pull_request synchronize  - would run on every push; ask with a comment instead
#   push, schedule, workflow_run, pull_request_target - cost or security risk, nothing to react to
#     (app builds run on Xcode Cloud, not GitHub Actions)
#
# Comment and issue events run this file from the default branch (master), so
# changes here only take effect once they reach master.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, labeled]

# One run per issue/PR at a time; a newer one queues instead of killing a run
# that is already pushing commits. Bot events (Claude's own comments) get their
# own group so they can't displace a queued human request.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.sender.type == 'Bot' && 'bot' || 'human' }}
  cancel-in-progress: false

jobs:
  claude:
    # Bots (including Claude's own comment and description edits) never start a run,
    # and on this public repo only the owner, members and collaborators can.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.body, '@claude') || contains(github.event.pull_request.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Labeling an issue "claude" starts a run without a mention
          label_trigger: claude

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*)"
            --append-system-prompt "When you change a PR or are asked to, keep its description current by editing only the sections of .github/pull_request_template.md. Keep the template headings, never remove human-written text, and only tick Tested boxes for checks you actually ran. Be concise overall. For GitHub issue comments, PR comments, and review replies, keep the tone conversational and default to a few short sentences focused on the answer or outcome, regardless of whether the request came from a mention in a description, comment, review, or an issue label. Skip report-style headings, long recaps, and repeated context in comments. When asked for an explanation, give a short one; provide a detailed report only when explicitly asked for a deep dive or thorough analysis. Keep essential findings, blockers, and verification results, but summarize them briefly. PR and issue descriptions may include the detail and structure they need; the short-comment default does not apply to descriptions."
